# CI: GitHub-hosted runners are the project's only Linux environment (DESIGN §19.4, PRD D-09).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly: the full matrix (10 seeds) and TC-PERF-02 (QA §6)

# Every job keeps its suites' logs and summary.txt in results/ (tests/run_suite.sh), posts the summaries as
# notices and uploads results/ as an artifact; the evidence job turns the run into evidence/ci/*.md (QA §11 M7).
env:
  RESULTS: ${{ github.workspace }}/results/ci

jobs:
  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: ${{ matrix.cc }} --version | head -1 && make --version | head -1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make CC=${{ matrix.cc }} 2>&1 | tee build.log || {
            grep -E 'error:|warning:' build.log | head -25 | sed 's/^/::error::/'
            exit 1
          }
      - name: Unit, CLI and session tests
        shell: bash
        run: |
          # TC-DISC-05 (b): broadcast to the runner's directed broadcast address (Linux only)
          if [ "$RUNNER_OS" = Linux ]; then
            export BCAST=$(ip -4 -o addr show scope global | awk '{for (i = 1; i < NF; i++) if ($i == "brd") { print $(i + 1); exit }}')
          fi
          set -o pipefail
          make test CC=${{ matrix.cc }} 2>&1 | tee test.log || {
            grep -E 'error:|warning:|FAIL|ERROR: |runtime error' test.log | head -25 | sed 's/^/::error::/'
            exit 1
          }
      - name: Results summary
        if: always()
        shell: bash
        run: |
          for f in $(find results -name summary.txt 2> /dev/null | sort); do
            { echo "#### $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$(basename "$(dirname "$f")")::$(awk '{ printf "%s%%0A", $0 }' "$f")"
          done
      - name: Upload results
        if: always()
        continue-on-error: true   # a storage hiccup must not fail the job; the tests decide (b936db3)
        uses: actions/upload-artifact@v5
        with:
          name: results-build-test-${{ matrix.os }}-${{ matrix.cc }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  asan:
    name: asan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: ASan + UBSan, 1M-input JSON fuzz (TC-UNIT-18, TC-DEL-08), 1M-datagram server fuzz (TC-SRV-07)
        env:
          FUZZ_ITERS: "1000000"
          FUZZ_DGRAMS: "334000"
        shell: bash
        run: |
          set -o pipefail
          make asan 2>&1 | tee asan.log || {
            grep -E 'error:|warning:|FAIL|ERROR: |SUMMARY:|runtime error' asan.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Results summary
        if: always()
        shell: bash
        run: |
          for f in $(find results -name summary.txt 2> /dev/null | sort); do
            { echo "#### $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$(basename "$(dirname "$f")")::$(awk '{ printf "%s%%0A", $0 }' "$f")"
          done
      - name: Upload results
        if: always()
        continue-on-error: true   # a storage hiccup must not fail the job; the tests decide (b936db3)
        uses: actions/upload-artifact@v5
        with:
          name: results-asan-${{ matrix.os }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  # M1 platform checks: PRD R-03 (multicast/broadcast) and R-11 (netem on the hosted kernel).
  platform-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the spike tool
        run: make build/netspike
      - name: Interfaces
        run: ip -4 addr; ip link show lo; ip route
      - name: Multicast via lo (127.0.0.1), as configured
        id: mcast_lo
        continue-on-error: true
        run: |
          build/netspike mcast 239.255.90.90 127.0.0.1 && echo "::notice::mcast via lo: ok" || { echo "::warning::mcast via lo: FAILED"; exit 1; }
      - name: Multicast via lo after 'ip link set lo multicast on' + route
        id: mcast_lo_fixed
        if: steps.mcast_lo.outcome == 'failure'
        continue-on-error: true
        run: |
          sudo ip link set lo multicast on
          sudo ip route add 239.0.0.0/8 dev lo || true
          build/netspike mcast 239.255.90.90 127.0.0.1 && echo "::notice::mcast via lo after enabling MULTICAST: ok" || { echo "::warning::mcast via lo after enabling MULTICAST: FAILED"; exit 1; }
      - name: Multicast via the primary interface
        id: mcast_eth
        continue-on-error: true
        run: |
          A=$(ip -4 -o addr show scope global | awk '{split($4,a,"/"); print a[1]; exit}')
          build/netspike mcast 239.255.90.90 "$A" && echo "::notice::mcast via $A: ok" || { echo "::warning::mcast via $A: FAILED"; exit 1; }
      - name: Broadcast to the directed broadcast address
        id: bcast
        continue-on-error: true
        run: |
          B=$(ip -4 -o addr show scope global | awk '{for (i = 1; i < NF; i++) if ($i == "brd") { print $(i + 1); exit }}')
          build/netspike bcast "$B" && echo "::notice::bcast to $B: ok" || { echo "::warning::bcast to $B: FAILED"; exit 1; }
      - name: Build the binaries and tools
        run: make all build/pcapcheck artifacts
      - name: TC-REL-01 - capture the session tests and check every frame on the wire
        shell: bash
        env:
          RESULTS: ${{ github.workspace }}/results/rel01
        run: |
          command -v tcpdump >/dev/null || sudo apt-get install -y tcpdump
          sudo tcpdump -i lo -U -w rel01.pcap 'udp and (portrange 25555-25557)' 2> tcpdump.err &
          sleep 2
          ZTP_PORT=25555 sh tests/m2_session.sh build/ztp-server build/ztp-device
          ZTP_PORT=25555 sh tests/m4_provision.sh build/ztp-server build/ztp-device build/mkartifacts
          ZTP_PORT=25555 sh tests/m5_upgrade.sh build/ztp-server build/ztp-device build/mkartifacts
          sleep 1
          sudo pkill -INT tcpdump || true
          sleep 1
          if build/pcapcheck --max-size 1200 rel01.pcap 25555 25556 > rel01.txt; then
            echo "::notice::TC-REL-01 / TC-PROV-04: $(cat rel01.txt)"
          else
            echo "::error::TC-REL-01: $(cat rel01.txt)"
            exit 1
          fi
      - name: TC-APX-01..10, TC-PDF-04 - Appendix A on the PDF's address 10.10.10.5:5555
        env:
          RESULTS: ${{ github.workspace }}/results/apx
        run: |
          sudo ip addr add 10.10.10.5/32 dev lo
          sudo tcpdump -i lo -U -w apx.pcap 'udp and host 10.10.10.5' 2> /dev/null &
          sleep 2
          rc=0
          APX_PCAP=apx.pcap sh tests/check_appendix_a.sh build/ztp-server build/ztp-device build/mkartifacts 10.10.10.5 5555 > apx.txt 2>&1 || rc=$?
          cat apx.txt
          sudo pkill -INT tcpdump || true
          sudo ip addr del 10.10.10.5/32 dev lo
          if [ $rc -ne 0 ]; then
            grep -E 'FAIL' apx.txt | head -20 | sed 's/^/::error::/'
            d=$(sed -n 's/.*(logs kept in \(.*\))/\1/p' apx.txt)
            for f in "$d"/ref.d.log "$d"/ref.s.log "$d"/ref.s.out "$d"/ref.d.out "$d"/hdr.txt; do
              [ -f "$f" ] && tail -12 "$f" | cut -c1-240 | sed "s|^|::error::$(basename "$f"): |"
            done
            exit $rc
          fi
      - name: TC-PROV-12 - a 1280-byte MTU path (lo MTU 1280) needs no fallback and never fragments
        env:
          RESULTS: ${{ github.workspace }}/results/prov12
        run: |
          sudo ip link set lo mtu 1280
          sudo tcpdump -i lo -U -w mtu.pcap 'udp port 37555' 2> /dev/null &
          sleep 2
          rc=0
          APX_SEEDS=0 APX_NO_STEPDOWN=1 sh tests/check_appendix_a.sh build/ztp-server build/ztp-device build/mkartifacts 127.0.0.1 37555 || rc=$?
          sleep 1
          sudo pkill -INT tcpdump || true
          sleep 1
          sudo ip link set lo mtu 65536
          [ $rc -eq 0 ] || exit $rc
          if build/pcapcheck --max-size 1200 mtu.pcap 37555 > mtu.txt; then echo "::notice::TC-PROV-12: $(cat mtu.txt)"
          else echo "::error::TC-PROV-12: $(cat mtu.txt)"; exit 1; fi
      - name: netem availability (R-11; failure waives TC-SIM-03)
        id: netem
        continue-on-error: true
        run: |
          sudo modprobe sch_netem
          sudo tc qdisc add dev lo root netem loss 15% 25% delay 5ms 2ms reorder 10% 50% duplicate 5%
          tc qdisc show dev lo
          ping -c 20 -i 0.05 127.0.0.1 | tail -2
          sudo tc qdisc del dev lo root
      - name: Record the result
        run: |
          echo "### Platform spike (ubuntu-latest)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "- mcast via lo: ${{ steps.mcast_lo.outcome }} (after enabling MULTICAST: ${{ steps.mcast_lo_fixed.outcome }})"
            echo "- mcast via primary interface: ${{ steps.mcast_eth.outcome }}"
            echo "- bcast: ${{ steps.bcast.outcome }}"
            echo "- netem: ${{ steps.netem.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::netem: ${{ steps.netem.outcome }}"
          uname -a >> "$GITHUB_STEP_SUMMARY"
      - name: Results summary
        if: always()
        shell: bash
        run: |
          for f in $(find results -name summary.txt 2> /dev/null | sort); do
            { echo "#### $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$(basename "$(dirname "$f")")::$(awk '{ printf "%s%%0A", $0 }' "$f")"
          done
      - name: Upload results
        if: always()
        continue-on-error: true   # a storage hiccup must not fail the job; the tests decide (b936db3)
        uses: actions/upload-artifact@v5
        with:
          name: results-platform-linux
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  # QA §6: the 5-device demo over impairment rows M1-M4 (TC-REL-09, TC-E2E-02); 3 seeds per push, 10 nightly,
  # plus TC-PERF-02 (row M4, 20 runs) at night.
  impair-matrix:
    name: impair-matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make all artifacts
      - name: Matrix M1-M4
        shell: bash
        run: |
          seeds=3; [ "${{ github.event_name }}" = schedule ] && seeds=10
          set -o pipefail
          ROWS="M1 M2 M3 M4" SEEDS=$seeds sh scripts/run_matrix.sh 2>&1 | tee matrix.txt || {
            grep -E 'FAIL' matrix.txt | head -20 | sed 's/^/::error::/'; exit 1; }
          echo "::notice::$(grep -E '^M[0-9]' matrix.txt | tr '\n' ';')"
      - name: TC-PERF-01 - 50 devices at 15% loss (done in 120 s, server RSS 64 MB)
        shell: bash
        run: |
          set -o pipefail
          sh scripts/run_scale.sh 50 2>&1 | tee scale.txt || { grep -E 'FAIL' scale.txt | head -10 | sed 's/^/::error::/'; exit 1; }
          echo "::notice::TC-PERF-01 $(grep -E '^scale:' scale.txt)"
      - name: TC-PERF-02 - time to OPERATIONAL, row M4 x 20 (nightly)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -o pipefail
          RESULTS=$RESULTS/perf02 ROWS=M4 SEEDS=20 sh scripts/run_matrix.sh 2>&1 | tee perf02.txt || {
            grep -E 'FAIL' perf02.txt | head -20 | sed 's/^/::error::/'; exit 1; }
          echo "::notice::TC-PERF-02 $(grep -E '^M4' perf02.txt)"
      - name: Results summary
        if: always()
        shell: bash
        run: |
          for f in $(find results -name summary.txt 2> /dev/null | sort); do
            { echo "#### $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$(basename "$(dirname "$f")")::$(awk '{ printf "%s%%0A", $0 }' "$f")"
          done
      - name: Upload results
        if: always()
        continue-on-error: true   # a storage hiccup must not fail the job; the tests decide (b936db3)
        uses: actions/upload-artifact@v5
        with:
          name: results-impair-matrix-${{ matrix.os }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  # QA §6 row M7: the demo with the impairment done by the kernel (netem on lo: correlated loss) instead of
  # in code; TC-SIM-03. 3 seeds per push, 10 nightly.
  impair-netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make all artifacts
      - name: Demo under netem (15% loss correlated 25%, 10% reorder, 5% dup, 5 ms)
        shell: bash
        run: |
          sudo modprobe sch_netem
          sudo tc qdisc add dev lo root netem loss 15% 25% delay 5ms reorder 10% 50% duplicate 5%
          seeds=3; [ "${{ github.event_name }}" = schedule ] && seeds=10
          rc=0
          for s in $(seq 1 $seeds); do
            d=$RESULTS/netem-seed$s; mkdir -p "$d"
            if IMPAIR= SEED=$s DEMO_DIR=$d PORT=$((50555 + 10 * s)) QUIET=1 sh scripts/run_demo.sh > demo.$s.txt 2>&1; then
              echo "seed $s: $(tail -1 demo.$s.txt)"
            else
              rc=1; grep -E 'FAIL' demo.$s.txt | head -10 | sed "s/^/::error::seed $s: /"
            fi
          done
          sudo tc qdisc del dev lo root
          [ $rc -eq 0 ] && echo "::notice::M7 (netem): $seeds of $seeds demos passed"
          exit $rc
      - name: Results summary
        if: always()
        shell: bash
        run: |
          for f in $(find results -name summary.txt 2> /dev/null | sort); do
            { echo "#### $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$(basename "$(dirname "$f")")::$(awk '{ printf "%s%%0A", $0 }' "$f")"
          done
      - name: Upload results
        if: always()
        continue-on-error: true   # a storage hiccup must not fail the job; the tests decide (b936db3)
        uses: actions/upload-artifact@v5
        with:
          name: results-impair-netem
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  # TC-PERF-04 on Linux: a soak with the server and one device under valgrind memcheck (leaks, invalid
  # accesses); the 1-hour soak with RSS and macOS leaks runs locally (make soak).
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          sudo apt-get install -y valgrind > /dev/null
          make all artifacts OPT="-O1 -g"
      - name: Soak under valgrind (3 min)
        shell: bash
        run: |
          set -o pipefail
          SOAK_S=180 WARMUP_S=30 VALGRIND=1 sh scripts/run_soak.sh 2>&1 | tee soak.txt || {
            grep -E 'FAIL' soak.txt | head -20 | sed 's/^/::error::/'; exit 1; }
          echo "::notice::$(grep -E '^soak:' soak.txt | tail -1)"
      - name: Results summary
        if: always()
        shell: bash
        run: |
          for f in $(find results -name summary.txt 2> /dev/null | sort); do
            { echo "#### $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$(basename "$(dirname "$f")")::$(awk '{ printf "%s%%0A", $0 }' "$f")"
          done
      - name: Upload results
        if: always()
        continue-on-error: true   # a storage hiccup must not fail the job; the tests decide (b936db3)
        uses: actions/upload-artifact@v5
        with:
          name: results-valgrind
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  platform-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Multicast on lo0
        run: |
          make build/netspike
          if build/netspike mcast 239.255.90.90 127.0.0.1; then echo "::notice::macOS mcast via lo0: ok"; else echo "::error::macOS mcast via lo0: FAILED"; exit 1; fi
      - name: Broadcast on the primary interface (informational)
        continue-on-error: true
        run: |
          IF=$(route -n get default | awk '/interface:/{print $2}')
          B=$(ifconfig "$IF" | awk '/broadcast/{print $NF; exit}')
          make build/netspike
          if build/netspike bcast "$B"; then echo "::notice::macOS bcast to $B via $IF: ok"; else echo "::warning::macOS bcast to $B via $IF: FAILED"; exit 1; fi

  # CI evidence: this run as Markdown (scripts/ci_evidence.sh) in the job summary and as an artifact; nightly
  # and manual runs on main also commit it to evidence/ci/ (GitHub deletes job logs after 90 days).
  evidence:
    needs: [build-test, asan, platform-linux, impair-matrix, impair-netem, valgrind, platform-macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: CI evidence report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SKIP_JOB: evidence
        run: |
          mkdir -p evidence/ci
          f=evidence/ci/$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}-run${{ github.run_number }}.md
          sh scripts/ci_evidence.sh ${{ github.run_id }} "$f"
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          echo "REPORT=$f" >> "$GITHUB_ENV"
      - name: Upload the report
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: ci-evidence
          path: evidence/ci/
      - name: Commit the report (nightly and manual runs on main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -q -m "CI evidence: run ${{ github.run_number }} (${{ github.event_name }}) [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
